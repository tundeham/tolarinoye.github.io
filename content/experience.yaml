- role: Research Scientist
  organisation: International Centre for Water Resources and Global Change (ICWRGC), UNESCO
  note: UNESCO Category 2 Centre hosted by the Federal Institute of Hydrology (BfG)
  url: https://waterandchange.org/en/
  location: Koblenz, Germany
  start: "Dec 2021"
  end: ""
  summary: Science, data and international outreach for the International Soil Moisture Network (ISMN) and the Centre.
  highlights:
    - Acquire in-situ soil moisture data from an international portfolio of data providers and develop ISMN data products, reporting and quality-controlled services.
    - Lead strategic outreach, public relations and communication for ISMN and the Centre, including contributions to the Centre's PR strategy and front-end web development.
    - Initiated and lead-convened a data-services session at the EGU General Assembly (2023) with ISMN, GRDC, GWDC, IGRAC and GTN-H as co-conveners.
    - Proposed and have since organised the annual ISMN splinter meeting at EGU (since 2023), bringing soil moisture data providers, users and product developers into one community.
    - Run the virtual ISMN data-provider workshop series (since February 2022).
    - Led the joint ISMN / IAHS HELPING side event and workshop at the IAHS Scientific Assembly, Roorkee, India (2025).
    - Co-convened the Large Sample Hydrology session at EGU, the largest hydrological sciences session at the assembly.
    - Contributed to a catalogue documenting six decades of German contributions to hydrology and the UNESCO International Hydrological Programme, produced for the programme's 50th anniversary.
    - Engage with WMO, UNESCO and GCOS (TOPC) structures and events on behalf of ISMN and the Centre.
  resume:
    - Acquisition, management and product development for the global ISMN data service and its international data-provider portfolio.
    - Strategic outreach, communication and stakeholder engagement for ISMN and the Centre.
    - "Initiated and led new international activities: an EGU data-services session (2023), an annual ISMN splinter meeting, a virtual data-provider workshop series and a joint ISMN / IAHS workshop in India (2025)."

