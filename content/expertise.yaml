areas:
  - id: hydrology
    num: "01"
    title: Hydrology and water resources assessment
    lead: Understanding how much water there is, where it goes and how it will change.
    problems:
      - How do aquifers and catchments respond to climate and land-use change?
      - How can water availability be assessed where data are scarce?
      - Which processes control recharge, storage and low flows?
    outputs:
      - Hydrological and water-balance assessments
      - Scenario analyses for urbanisation and climate change
      - Recession, hydrograph and aquifer characterisation
      - Clear technical reports with documented uncertainty
    evidence: PhD on karst aquifer hydrodynamics; Arusha, Tanzania groundwater study; groundwater projects in Nigeria.

  - id: soil-moisture
    num: "02"
    title: Soil moisture and hydroclimatic monitoring
    lead: Building and using observations that show how wet or dry a landscape really is.
    problems:
      - How can satellite and model soil moisture be validated against ground measurements?
      - How can drought and water stress be tracked consistently across regions?
      - How can observation networks be extended and kept reliable?
    outputs:
      - Guidance on soil moisture monitoring networks and data providers
      - Harmonised, quality-controlled observation datasets
      - Interpretation of hydroclimatic data for drought and water-security questions
    evidence: Scientific Officer for the International Soil Moisture Network; installation of 270 soil moisture probes at three European field sites (2018).

  - id: geospatial
    num: "03"
    title: Geospatial analysis, Earth observation and modelling
    lead: Linking satellite, model and field information into usable evidence.
    problems:
      - How reliable are Earth observation products at the local scale?
      - How can land-use and land-cover change be linked to water balance?
      - Where can machine learning add value to hydrological prediction?
    outputs:
      - Ground-truthing and validation of remote-sensing products
      - GIS-based spatial analysis for water resources questions
      - Large-sample and machine-learning analyses with reproducible workflows
    evidence: Land-use mapping from Landsat 5 and Sentinel-2 with field validation; large-sample hydrology; remote sensing and GIS training (IST Lisbon).

  - id: data
    num: "04"
    title: Environmental data management and digital infrastructure
    lead: Making water data findable, trustworthy and usable.
    problems:
      - How can heterogeneous data from many providers be integrated and quality-controlled?
      - How can databases and web services be designed for long-term, open access?
      - How can a data service reach and serve its user community?
    outputs:
      - Data acquisition, harmonisation and quality-assurance workflows
      - Database design and data-product development
      - Front-end web delivery and user-facing documentation
    evidence: WoKaS (400+ springs); ISMN data products and web services; SQL and database management.

  - id: governance
    num: "05"
    title: Water information systems and scientific data governance
    lead: Connecting data centres, institutions and communities around shared standards.
    problems:
      - How can national and global data centres cooperate rather than duplicate?
      - How can open, transboundary data sharing be made routine and trusted?
      - How can scientific data services be explained to funders and policy makers?
    outputs:
      - Strategic communication and stakeholder engagement for data services
      - Convening of expert communities, workshops and side events
      - Input to open-data and data-sharing policies
    evidence: Cross-institutional EGU session with ISMN, GRDC, GWDC, IGRAC and GTN-H; engagement with UNESCO-IHP, WMO and GCOS structures.
