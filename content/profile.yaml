# ------------------------------------------------------------------ biographies
# Written in the third person without pronouns so they can be pasted into
# programmes, introductions and institutional websites as they are.
bio_short: >-
  Dr. Tunde Olarinoye is a water resources scientist and hydrologist with a PhD
  from the University of Freiburg, specialising in groundwater and karst
  hydrology, soil moisture observation and large-sample hydrological data.
  As Scientific Officer at the International Centre for Water Resources and
  Global Change (ICWRGC), a UNESCO Category 2 Centre at the German Federal
  Institute of Hydrology, Dr. Olarinoye works on the International Soil Moisture
  Network, a global open data service. Earlier work led the development of
  WoKaS, the first global open database of karst spring discharge, published in
  Scientific Data. Educated in Nigeria, the Netherlands, Portugal and Germany,
  Dr. Olarinoye convenes international conference sessions and workshops,
  contributes to IAHS and European research networks, and is open to advisory,
  consulting and research collaboration on water resources and environmental data.

bio_long:
  - >-
    Dr. Tunde Olarinoye is a water resources scientist and international advisor
    whose work connects hydrological research, environmental data and water
    management practice. A hydrologist with a PhD from the University of
    Freiburg, Dr. Olarinoye specialises in groundwater and karst hydrology, soil
    moisture observation, large-sample hydrology and the data systems that make
    water information open, trustworthy and usable.
  - >-
    The academic path spans four countries. A BSc in Agricultural and
    Environmental Engineering at Olabisi Onabanjo University in Nigeria,
    completed with First Class Honours and the award for best graduating student,
    was followed by the Erasmus Mundus Joint Master's programme on Groundwater and
    Global Change, taught across IHE Delft in the Netherlands, Instituto Superior
    Técnico in Lisbon and TU Dresden, on a full European Union scholarship. At the
    Chair of Hydrological Modelling and Water Resources in Freiburg, doctoral
    research used comparative, large-sample hydrology to understand how karst
    aquifers store and release water. That work led to WoKaS, the first global
    open database of karst spring discharge, published in Scientific Data in 2020,
    and to automated methods for recession analysis published in Hydrology and
    Earth System Sciences in 2022.
  - >-
    Since December 2021, Dr. Olarinoye has been Scientific Officer at the
    International Centre for Water Resources and Global Change (ICWRGC), a UNESCO
    Category 2 Centre hosted by the German Federal Institute of Hydrology in
    Koblenz. The work centres on the International Soil Moisture Network (ISMN):
    acquiring in-situ observations from an international portfolio of data
    providers, developing data products, and leading strategic outreach,
    communication and community building for the network and the Centre.
    Initiatives proposed and led include a data-services session at the EGU General
    Assembly (2023), an annual ISMN splinter meeting, a virtual data-provider
    workshop series running since 2022, and a joint ISMN and IAHS HELPING
    workshop at the IAHS Scientific Assembly in Roorkee, India (2025).
  - >-
    Earlier experience includes groundwater and hydrological database management
    for projects in Nigeria, research at Deltares and IHE Delft, and field
    campaigns in Tanzania, France, Spain, the United Kingdom and Germany. Dr.
    Olarinoye has co-supervised Bachelor's and Master's theses, guest-lectured at
    IHE Delft, co-convened the Large Sample Hydrology session at the EGU General
    Assembly, and reviews for Water Resources Research, the Journal of Hydrology
    and Earth System Science Data.
  - >-
    A strong advocate of open, transboundary data sharing as a foundation for
    resilient water governance, Dr. Olarinoye is interested in research
    partnerships, technical advisory work, expert panels and programmes that move
    water science into practice. Based in Germany, Dr. Olarinoye is available for
    international collaboration.

