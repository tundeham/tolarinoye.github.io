# ------------------------------------------------------------------ homepage introduction
intro:
  - >-
    I am a water resources scientist specialising in hydrology, environmental
    data systems and the application of scientific knowledge to sustainable
    water management.
  - >-
    My work brings together hydrological research, in-situ observations,
    geospatial analysis and digital innovation to improve our understanding of
    water systems and support informed decision-making.
  - >-
    With a multidisciplinary academic background and professional experience in
    international scientific cooperation, I work at the intersection of
    research, data and development. My interests include soil moisture
    monitoring, hydrological modelling, water information systems, climate
    resilience and strengthening the scientific foundations of water resources
    management.
  - >-
    I am particularly interested in collaborations that connect scientific
    institutions, universities, governments and international development
    organisations to address pressing water and environmental challenges.

