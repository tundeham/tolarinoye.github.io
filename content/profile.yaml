about:
  - >-
    I am a hydrologist with a Ph.D. from the University of Freiburg, where my
    research focused on understanding the hydrodynamic behaviour of karst
    aquifers, which supply drinking water to a large part of the world's
    population, through comparative, large-sample hydrology.
  - >-
    I led the development of the World Karst Spring Hydrograph database
    (WoKaS), the first global open dataset of karst spring discharge. I also
    developed automated methods for recession analysis and classification of
    karst springs. At the ICWRGC (UNESCO) I work at the interface of science
    and data services, including data acquisition, soil-moisture data products
    and web development for the International Soil Moisture Network (ISMN).
  - >-
    My interests span large-data analysis and management, hydrological
    modelling, groundwater and global-change impact assessment, and machine
    learning in hydrology.

